<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Voting System</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
      .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; }
      input, textarea, button, select { width: 100%; margin-top: 0.4rem; margin-bottom: 0.8rem; padding: 0.5rem; }
      button { cursor: pointer; }
      pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>School Voting System</h1>
    <p>Create and manage multiple elections and ballots with admin controls.</p>
    <div class="grid">
      <section class="card">
        <h2>Admin: Create Election</h2>
        <input id="adminToken" placeholder="Admin token" value="school-admin-secret" />
        <input id="electionTitle" placeholder="Election title" />
        <textarea id="electionDescription" placeholder="Description"></textarea>
        <button onclick="createElection()">Create Election</button>
      </section>
      <section class="card">
        <h2>Voter: Cast Vote</h2>
        <input id="voteElectionId" placeholder="Election ID" />
        <input id="voterId" placeholder="Voter ID" />
        <input id="ballotId" placeholder="Ballot ID" />
        <input id="optionId" placeholder="Option ID" />
        <button onclick="castVote()">Submit Vote</button>
      </section>
    </div>

    <section class="card" style="margin-top: 1rem;">
      <h2>Response</h2>
      <pre id="output">Ready.</pre>
    </section>

    <script>
      async function request(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options
        });
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      }

      function createElection() {
        const token = document.getElementById('adminToken').value;
        const title = document.getElementById('electionTitle').value;
        const description = document.getElementById('electionDescription').value;

        request('/admin/elections', {
          method: 'POST',
          headers: { 'x-admin-token': token },
          body: JSON.stringify({ title, description })
        });
      }

      function castVote() {
        const electionId = document.getElementById('voteElectionId').value;
        const voterId = document.getElementById('voterId').value;
        const ballotId = document.getElementById('ballotId').value;
        const optionId = document.getElementById('optionId').value;

        request(`/elections/${electionId}/votes`, {
          method: 'POST',
          body: JSON.stringify({ voterId, ballotId, optionId })
        });
      }
    </script>
  </body>
</html>
